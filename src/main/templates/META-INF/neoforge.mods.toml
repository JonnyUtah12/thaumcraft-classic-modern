modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"

description='''
UNOFFICIAL PORT. Thaumcraft Classic is an independent, community port of
Thaumcraft 4.2.3.5 (Minecraft 1.7.10) to Minecraft 1.21.1 / NeoForge.
Not affiliated with, endorsed by, or approved by Azanor. Thaumcraft and all
original content are the work of Azanor.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional accessory framework (Baubles-equivalent). The Curios bridge activates
# only when Curios is present; the core mod never requires or bundles it.
# Version floor = the ATM10 8.3 pin (docs/atm10-compatibility.md).
[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[${curios_version},)"
    ordering="AFTER"
    side="BOTH"

# Optional recipe browser (SPINE-4, docs/jei-integration.md). The @JeiPlugin in
# client/jei is discovered by JEI itself, so nothing in the core mod references
# a mezz.jei type and the mod loads identically when JEI is absent (D-011: the
# browser is an integration convenience, not port content). JEI is client-side,
# so the declaration is CLIENT; the version floor is the build the ATM10 instance
# ships. Licensing (recorded with D-011/D-016): JEI is third-party — compile-time
# API plus runtime-optional, and its jar is never redistributed by this project.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[${jei_version},)"
    ordering="AFTER"
    side="CLIENT"
