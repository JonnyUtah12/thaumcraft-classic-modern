name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      # In-game tests on the NeoForge game test server (docs/testing.md).
      # Separate from `build` so the unit layer stays fast; a red run here
      # blocks release (docs/release-process.md).
      - name: Game tests
        run: ./gradlew runGameTestServer
        timeout-minutes: 20

      # runGameTestServer can exit 0 even when the server crashes during mod
      # loading (no tests ever run), so assert the summary line explicitly.
      - name: Assert game tests ran and passed
        run: grep -q "required tests passed" run/logs/latest.log
