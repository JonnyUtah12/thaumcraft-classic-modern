import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // Curios API (optional Baubles-equivalent accessory integration) — the mod's own Maven.
    maven {
        name = "Blameless Maven"
        url = "https://maven.theillusivec4.top/"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // TC-M2-01 registration harness: probe content + the id-contract CSV.
            systemProperty 'thaumcraft.testprobe', 'true'
            systemProperty 'tc.contentMappingFile', file('docs/content-mapping.csv').getAbsolutePath()
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // TC-M2-02: codec round-trip tests exercise Mojang Codec/NBT classes, so the
    // test source set now runs against the Minecraft/NeoForge classpath.
    // (In-game behavior remains covered by NeoForge gametests, docs/testing.md.)
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// localRuntime: present for local/in-game testing but never published as a
// hard dependency (the mod must load with or without Curios).
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional accessory integration. The bridge compiles against the Curios
    // API but bundles nothing; core loads with or without it. -Ptc.noCurios
    // removes it from localRuntime to exercise the built-in fallback.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    if (!project.hasProperty('tc.noCurios')) {
        localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    }

    // Unit-test harness. With neoForge.unitTest enabled the test source set has
    // the Minecraft/NeoForge classpath: unit tests cover pure logic, data, build
    // wiring, and persistence codecs. In-game behavior is covered by NeoForge
    // gametests (docs/testing.md).
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.tomlj:tomlj:1.1.1'
    // TC-M8-01: the Curios adapter unit test compiles against the Curios API
    // (compileOnly for main; tests need it on their own compile classpath).
    testImplementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // Versionless: with neoForge.unitTest the Minecraft dependency platform pins
    // gson strictly (2.10.1 for 1.21.1); an explicit version would conflict.
    testImplementation 'com.google.code.gson:gson'
}

// --- Original-asset pipeline (docs/licensing-and-attribution.md) -------------
// Thaumcraft 4.2.3.5 is All Rights Reserved: original textures/models/sounds/
// lang are NOT committed to this repository. They live in the local reference
// tree extracted from the user's own JAR. When that tree exists, the build
// overlays it into the output JAR so local/release artifacts carry the original
// visuals; CI (no reference tree) builds a code-only JAR and the unit tests
// assert the asset mapping instead of the assets themselves.
def originalAssetsDir = file("${rootDir}/../reference/assets")

// The original 1.7.10 sounds.json is not platform-valid as-is: its file
// references carry no namespace, and 1.21.1 resolves unnamespaced references
// against the `minecraft` namespace (the TC-M2-03 client smoke run logged a
// caught ResourceLocationException for `minecraft:runicShieldEffect` — a single
// invalid id discards the whole file). Event keys, by contrast, must stay
// unnamespaced: 1.21.1 derives the event namespace from the assets/<ns>/
// directory. The overlay therefore rewrites the registry: file references
// prefixed with `thaumcraft:`, per-event `category` dropped (1.21.1 sets
// category at the play site), and the two camelCase ids — invalid in 1.21.1
// resource ids ([a-z0-9/._-] only) — normalized to snake_case.
// docs/asset-mapping.csv records the same renames; OriginalSoundOverlayTest
// guards both sides.
def soundEventRenames = [
        'runicShieldEffect' : 'runic_shield_effect',
        'runicShieldCharge' : 'runic_shield_charge',
]

def overlayOriginalAssets = tasks.register("overlayOriginalAssets", Sync) {
    onlyIf { originalAssetsDir.exists() }
    from(originalAssetsDir) {
        include 'thaumcraft/**'
        exclude 'thaumcraft/sounds.json' // rewritten by transformOriginalSoundsJson
    }
    into(layout.buildDirectory.dir('generated/resources/original-assets/assets'))
    eachFile { details ->
        def path = details.relativePath.pathString
        if (path.startsWith('thaumcraft/sounds/') && path.endsWith('.ogg')) {
            def renamed = soundEventRenames[path - 'thaumcraft/sounds/' - '.ogg']
            if (renamed != null) {
                details.relativePath = new RelativePath(true, 'thaumcraft', 'sounds', renamed + '.ogg')
            }
        }
    }
}

def transformOriginalSoundsJson = tasks.register("transformOriginalSoundsJson") {
    onlyIf { originalAssetsDir.exists() }
    def sourceJson = file("${originalAssetsDir}/thaumcraft/sounds.json")
    def outputJson = layout.buildDirectory.file('generated/resources/original-sounds/assets/thaumcraft/sounds.json')
    inputs.file(sourceJson)
    inputs.property('soundEventRenames', soundEventRenames)
    outputs.file(outputJson)
    doLast {
        def text = sourceJson.getText('UTF-8')
        if (text.startsWith('\uFEFF')) { text = text.substring(1) } // strip BOM
        def original = new JsonSlurper().parseText(text)
        def converted = original.collectEntries { eventKey, definition ->
            def body = definition.findAll { key, value -> key != 'category' }
            body.sounds = (definition.sounds ?: []).collect { entry ->
                if (entry instanceof Map) {
                    def copy = new LinkedHashMap(entry)
                    def name = entry.name as String
                    copy.name = 'thaumcraft:' + soundEventRenames.getOrDefault(name, name)
                    return copy
                }
                return 'thaumcraft:' + soundEventRenames.getOrDefault(entry as String, entry as String)
            }
            def id = eventKey as String
            // Keys stay unnamespaced: SoundManager resolves them as
            // fromNamespaceAndPath(<directory namespace>, key).
            return [ soundEventRenames.getOrDefault(id, id), body ]
        }
        def out = outputJson.get().asFile
        out.parentFile.mkdirs()
        out.text = JsonOutput.prettyPrint(JsonOutput.toJson(converted))
    }
}

// TC-M7-02-s: the original's FX sprites are not per-file PNGs. They live in a
// 16-column x 16-row cell grid inside textures/misc/particles.png (256x256),
// and the FX code indexes that grid with a flat cell number:
// ClientProxy.drawGenericParticles takes startParticle=112 / numParticles=9
// (ClientProxy.java:592-606, passed by every ClientProxy.blockSparkle caller),
// and FXBubble indexes cells 16 (body) and 17 (pop) through its own
// particle-frame counter. 1.21.1 indexes a frame list of real sprites
// (assets/<ns>/particles/<id>.json -> the particle atlas, which collects every
// namespace's textures/particle/ folder), so the build slices the cells the
// ported particles use into one sprite per cell. Slicing at build time keeps
// the original sheet as the source of truth (D-004: no original asset is
// committed); the particle JSONs committed in src/main/resources name the
// sliced ids, and ParticleSpriteSlicingTest pins the cell -> sprite mapping.
def originalParticleSheet = file("${originalAssetsDir}/thaumcraft/textures/misc/particles.png")
def originalParticleSpritesDir = layout.buildDirectory.dir('generated/resources/original-particles')
// cell index -> <sprite base name, frame order>; cell (col, row) = (idx % 16, idx / 16)
def originalParticleCells = [
        'sparkle'       : (112..120).toList(),
        'bubble'        : [16, 17],
        // TC-M7-02-c-s: the FXXxx classes page the same sheet with their own
        // UV maths; the cell lists below are those UV windows decoded to cells,
        // in the order the particle advances frames (age % frameCount).
        'vis_sparkle'   : (128..143).toList(),   // FXVisSparkle: u=part/16, v=0.5, part = age % 16
        'bore_sparkle'  : (64..67).toList(),     // FXBoreSparkle: u=part/16, v=0.25, part = age % 4
        'essentia_trail': [25],                  // FXEssentiaTrail: fixed u=0.5625, v=0.0625
        'wisp_arcing'   : [224],                 // FXWispArcing: u=0, v=0.875 (col 0, row 14)
]
// Non-sheet sprites (TC-M7-02-c-s): rectangles inside the wisp textures —
// FXWisp pages wisp.png (256x256) at u 0..0.125, v 0.875..1.0 (a 32x32 cell
// at (0, 224), FXWisp.java:152-154); FXWispEG pages wispy.png (512x128) at
// u = (age % 13)/16 .. +0.0624, v = 0.1875..0.25 — 13 strips of 32x8 px at
// y = 24 (FXWispEG.java:60-62).
def originalParticlePatches = [
        'wisp'   : [source: "${originalAssetsDir}/thaumcraft/textures/misc/wisp.png",
                    rects : [[0, 224, 32, 32]]],
        'wisp_eg': [source: "${originalAssetsDir}/thaumcraft/textures/misc/wispy.png",
                    rects : (0..12).collect { [it * 32, 24, 32, 8] }],
]
// Whole-texture sprites (TC-M7-02-c-s): the shield runes and the sonic pulse
// bind models/hemis<N>.png / models/ripple<N>.png (N = 1..15) per frame
// (FXShieldRunes.java:59-67, FXSonic.java:57-59); the particle atlas needs
// them as sprites, so the files are copied under frame-indexed names.
def originalParticleFiles = [
        'shield_runes': (1..15).collect { "${originalAssetsDir}/thaumcraft/textures/models/hemis${it}.png" },
        // FXShieldRunes' mob branch and FXSonic bind the SAME rippleN frames
        // (FXShieldRunes.java:61-64, FXSonic.java:59), so one sliced frame set
        // serves both particle definitions — thaumcraft:particle/ripple_0..14.
        'ripple'      : (1..15).collect { "${originalAssetsDir}/thaumcraft/textures/models/ripple${it}.png" },
]

def sliceOriginalParticleSprites = tasks.register("sliceOriginalParticleSprites") {
    onlyIf { originalParticleSheet.exists() }
    inputs.file(originalParticleSheet)
    inputs.property('cells', originalParticleCells)
    inputs.property('patches', originalParticlePatches)
    inputs.property('files', originalParticleFiles)
    inputs.files(originalParticlePatches.collect { new File(it.value.source as String) })
    inputs.files(originalParticleFiles.collectMany { it.value })
    outputs.dir(originalParticleSpritesDir)
    doLast {
        def out = originalParticleSpritesDir.get().asFile
        def spriteDir = new File(out, 'assets/thaumcraft/textures/particle')
        // The maps above are the source of truth: clear the directory first so a
        // frame set that gets renamed/merged cannot leave orphan sprites in the
        // jar (ParticleSpriteSlicingTest fails on any orphan).
        if (spriteDir.exists()) { spriteDir.deleteDir() }
        spriteDir.mkdirs()
        def image = javax.imageio.ImageIO.read(originalParticleSheet)
        if (image == null) { throw new GradleException("cannot decode ${originalParticleSheet}") }
        def written = 0
        originalParticleCells.each { name, cells ->
            cells.eachWithIndex { cell, frame ->
                def x = (cell % 16) * 16
                def y = ((int) (cell / 16)) * 16
                def sprite = image.getSubimage(x, y, 16, 16)
                def file = new File(spriteDir, "${name}_${frame}.png")
                if (!javax.imageio.ImageIO.write(sprite, 'png', file)) {
                    throw new GradleException("no PNG writer for ${file}")
                }
                written++
            }
        }
        originalParticlePatches.each { name, spec ->
            def patchImage = javax.imageio.ImageIO.read(new File(spec.source as String))
            if (patchImage == null) { throw new GradleException("cannot decode ${spec.source}") }
            spec.rects.eachWithIndex { rect, frame ->
                def sprite = patchImage.getSubimage(rect[0] as int, rect[1] as int, rect[2] as int, rect[3] as int)
                def file = new File(spriteDir, "${name}_${frame}.png")
                if (!javax.imageio.ImageIO.write(sprite, 'png', file)) {
                    throw new GradleException("no PNG writer for ${file}")
                }
                written++
            }
        }
        originalParticleFiles.each { name, sources ->
            sources.eachWithIndex { src, frame ->
                def file = new File(spriteDir, "${name}_${frame}.png")
                file.bytes = new File(src as String).bytes
                written++
            }
        }
        logger.lifecycle("sliced ${written} particle sprites from ${originalParticleSheet.name}")
    }
}

sourceSets.main.resources {
    srcDir(layout.buildDirectory.dir('generated/resources/original-assets'))
    srcDir(layout.buildDirectory.dir('generated/resources/original-sounds'))
    srcDir(originalParticleSpritesDir)
}
tasks.named('processResources') {
    dependsOn overlayOriginalAssets, transformOriginalSoundsJson, sliceOriginalParticleSprites
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            curios_version         : curios_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Unit tests receive build-wired values so they never hardcode them;
// gradle.properties stays the single source of truth (docs/release-process.md).
tasks.named('test', Test).configure {
    useJUnitPlatform()
    dependsOn generateModMetadata, overlayOriginalAssets, transformOriginalSoundsJson, sliceOriginalParticleSprites
    systemProperty 'tc.modId', mod_id
    systemProperty 'tc.modName', mod_name
    systemProperty 'tc.modLicense', mod_license
    systemProperty 'tc.modVersion', mod_version
    systemProperty 'tc.minecraftVersion', minecraft_version
    systemProperty 'tc.neoVersion', neo_version
    systemProperty 'tc.curiosVersion', curios_version
    systemProperty 'tc.generatedModsToml',
            layout.buildDirectory.file('generated/sources/modMetadata/META-INF/neoforge.mods.toml').get().asFile.absolutePath
    systemProperty 'tc.assetMappingFile',
            file('docs/asset-mapping.csv').absolutePath
    systemProperty 'tc.originalAssetsOverlayDir',
            layout.buildDirectory.dir('generated/resources/original-assets/assets').get().asFile.absolutePath
    systemProperty 'tc.originalSoundsJson',
            layout.buildDirectory.file('generated/resources/original-sounds/assets/thaumcraft/sounds.json').get().asFile.absolutePath
    systemProperty 'tc.originalParticleSheet',
            file("${originalAssetsDir}/thaumcraft/textures/misc/particles.png").absolutePath
    systemProperty 'tc.particleDefinitionDir',
            file('src/main/resources/assets/thaumcraft/particles').absolutePath
    systemProperty 'tc.originalParticleSpritesDir',
            layout.buildDirectory.dir('generated/resources/original-particles').get().asFile.absolutePath
    systemProperty 'tc.originalParticleSourceDir',
            file("${originalAssetsDir}/thaumcraft/textures").absolutePath
    systemProperty 'tc.configReferenceFile',
            file('docs/config-reference.md').absolutePath
    systemProperty 'tc.contentMappingFile',
            file('docs/content-mapping.csv').absolutePath
    // TC-M8-01 accessory layer guards: bytecode isolation (no core class may
    // reference Curios types) + Curios data-file/slot-model consistency.
    systemProperty 'tc.mainClassesDir',
            sourceSets.main.java.classesDirectory.get().asFile.absolutePath
    systemProperty 'tc.modDataDir',
            file('src/main/resources/data').absolutePath
    systemProperty 'tc.researchDataDir',
            file('src/main/resources/data/thaumcraft/research_graph').absolutePath
    systemProperty 'tc.contentInventoryFile',
            file('docs/original-content-inventory.md').absolutePath
    systemProperty 'tc.balanceValuesFile',
            file('docs/balance-values.md').absolutePath
    systemProperty 'tc.originalLangFile',
            file('../reference/assets/thaumcraft/lang/en_US.lang').absolutePath
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
