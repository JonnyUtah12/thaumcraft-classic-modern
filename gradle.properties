# Memory defaults for Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment parameter mappings for 1.21.1 (verified pair used by the sibling
# project thaumaturgical-legacy on this exact NeoForge version).
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment — MUST stay exactly on the verified target (docs/target-platform.md).
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.259
loader_version_range=[1,)

# Optional accessory framework (Baubles-equivalent). Version pinned to what
# ATM10 8.3 ships; compileOnly + localRuntime only — never bundled.
# Pass -Ptc.noCurios to verify the no-Curios fallback.
curios_version=9.5.1+1.21.1

## Mod Properties
# mod_id is the lowercased original mod id ("Thaumcraft" -> "thaumcraft"):
# MC 1.21.1 requires lowercase resource paths, so content ids stay as close to
# the original `Thaumcraft:*` as the platform permits. See docs/porting-decisions.md.
mod_id=thaumcraft
mod_name=Thaumcraft Classic (Unofficial)
mod_license=MIT
mod_version=0.1.0-alpha.1
mod_group_id=com.jonnyutah12.thaumcraftclassic
mod_authors=JonnyUtah12
mod_description=Unofficial high-fidelity port of Thaumcraft 4.2.3.5 (Minecraft 1.7.10) to Minecraft 1.21.1 / NeoForge 21.1.259. Independent project; not affiliated with or endorsed by Azanor.
